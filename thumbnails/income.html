<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mystic Pets income thumbnail</title>
<link rel="stylesheet" href="lib/thumb.css">
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<!--
  Mystic Pets "start vs maxed" split thumbnail. Numbers come from the game (PetService.GetPlayerIncome):
    start : 1 Common pet (coinMult 60) = 60 coins/s, in Starter Meadow
    maxed : 6 Rainbow Void Serpents (2,000,000 x 10 Rainbow) x 25 Grandmaster rebirth x 2 (2x Coins pass)
            x 5 (5x Coins boost) = 30,000,000,000 coins/s, in Star Space
-->
<div id="frame">
  <canvas id="left"></canvas>
  <canvas id="right"></canvas>
  <svg class="overlay" viewBox="0 0 1920 1080"><polygon points="890,0 920,0 1000,1080 970,1080" fill="#000"/></svg>

  <div class="label" style="left:452px; top:30px; font-size:196px; --stroke:32px; --drop:13px">
    <span class="stroke">60/s</span><span class="fill">60/s</span>
  </div>
  <div class="label rainbow" style="left:1440px; top:22px; font-size:196px; --stroke:32px; --drop:13px">
    <span class="stroke">30B/s</span><span class="fill">30B/s</span>
  </div>
  <div class="label" style="left:1440px; top:226px; font-size:48px; --stroke:14px; --drop:6px">
    <span class="stroke">30,000,000,000/s</span><span class="fill">30,000,000,000/s</span>
  </div>

  <div class="label logo" style="left:955px; top:908px; font-size:132px; --stroke:30px; --drop:12px">
    <span class="stroke">MYSTIC PETS</span><span class="fill">MYSTIC PETS</span>
  </div>
</div>

<script type="module">
import { makeStage } from './lib/stage.js';
import { mulberry32 } from './lib/kit.js';
import * as pets from './lib/pets.js';
import * as props from './lib/props.js';

const frame = document.getElementById('frame');

// Two-line name tag like PetModels.addNameTag, anchored above a pet (world point).
function nameTag(stage, canvasLeft, world, name, nameColor, rarity, rarityColor, size = 44) {
  const [x, y] = stage.project(world);
  const line = (text, color, px, top) => {
    const el = document.createElement('div');
    el.className = 'label tag';
    el.style.cssText = `left:${canvasLeft + x}px; top:${top}px; font-size:${px}px; --stroke:${Math.round(px * 0.28)}px; --fill:${color}`;
    el.innerHTML = `<span class="stroke">${text}</span><span class="fill">${text}</span>`;
    frame.appendChild(el);
  };
  line(rarity, rarityColor, Math.round(size * 0.72), y);
  line(name, nameColor, size, y - size * 0.8);
}

try {
  await document.fonts.load('200px "Lilita One"');
  await document.fonts.load('900 40px "Montserrat"');

  // ---------------- LEFT: Starter Meadow, one Common cat
  const leftCanvas = document.getElementById('left');
  const L = makeStage(leftCanvas, {
    width: 1000, height: 1080, fov: 30,
    camPos: [1.3, 2.0, 8.1], target: [0.1, 1.42, 0],
    sky: { top: '#3f9fe6', horizon: '#9fdaf2', horizonAt: 0.5 },   // Meadow skyColor 135,206,235
    ground: { base: '#5fb03a', line: '#7fc95a' },                   // Meadow groundColor 100,180,60
    shadowSize: 5,
    bloom: null,
  });
  leftCanvas.style.left = '0px';
  leftCanvas.style.clipPath = 'polygon(0 0, 905px 0, 985px 1080px, 0 1080px)';
  const cat = pets.kitten(L.kit, { color: [196, 198, 204], light: [236, 237, 242] });
  cat.rotation.y = 0.42;
  L.scene.add(cat);
  props.coin(L.kit, L.scene, { r: 0.24, pos: [-1.0, 0.75, 0.6], rot: [Math.PI / 2 - 0.12, 0.0, 0.28] });
  L.render();
  nameTag(L, 0, [0.05, 2.2, 0.05], 'cat', 'rgb(180,180,180)', 'Common', 'rgb(180,180,180)', 40);

  // ---------------- RIGHT: Star Space, Rainbow Void Serpents
  const rightCanvas = document.getElementById('right');
  const R = makeStage(rightCanvas, {
    width: 1040, height: 1080, fov: 30,
    camPos: [0.3, 4.4, 16.8], target: [0.1, 3.3, 0],
    sky: {                                                           // Space skyColor 5,5,20
      top: '#04030f', horizon: '#2a1766', horizonAt: 0.52, stars: 520, seed: 11,
      nebula: [
        { x: 0.22, y: 0.18, r: 0.42, color: 'rgba(160,60,255,0.55)' },
        { x: 0.82, y: 0.3, r: 0.38, color: 'rgba(40,120,255,0.45)' },
        { x: 0.55, y: 0.48, r: 0.3, color: 'rgba(255,80,200,0.35)' },
      ],
    },
    ground: { base: '#141440', line: '#7b6bff', glow: 0.7 },          // Space groundColor 20,20,60
    fog: [26, 80],
    hemi: 0.9, hemiColors: [0xa597ff, 0x1c1650],
    sunColor: 0xf0e6ff, sunIntensity: 2.3,
    rim: { color: 0x79d9ff, intensity: 2.2, dir: [7, 6, -10] },
    env: 0.5,
    shadowSize: 10,
    bloom: { strength: 0.9, radius: 0.5 },
  });
  rightCanvas.style.left = '880px';
  rightCanvas.style.clipPath = 'polygon(25px 0, 1040px 0, 1040px 1080px, 105px 1080px)';
  const rng = mulberry32(7);
  const k = R.kit, S = R.scene;
  const RAINBOW = [[255, 70, 70], [255, 160, 40], [255, 235, 60], [70, 255, 120], [60, 200, 255], [190, 90, 255]];

  props.halo(S, { pos: [0, 3.0, -4.5], size: 10, color: [200, 90, 255], intensity: 0.45 });
  props.groundRing(k, S, { pos: [0, 0, 0], R: 2.1, color: [0, 200, 255] });   // Mythic rarity color

  const hero = pets.serpent(k, { color: [150, 50, 255], rings: RAINBOW });
  hero.scale.setScalar(1.55);
  hero.rotation.y = -0.12;
  S.add(hero);
  for (const [x, z, ry] of [[-3.0, -2.6, 0.5], [3.1, -2.4, -0.5]]) {
    const s = pets.serpent(k, { color: [150, 50, 255], rings: RAINBOW });
    s.position.set(x, 0, z);
    s.rotation.y = ry;
    s.scale.setScalar(1.05);
    S.add(s);
  }

  props.coinPile(k, S, { center: [-2.5, 0, 1.6], radius: 1.0, height: 0.55, count: 65, r: 0.21, rng, gem: { size: 0.34, color: [190, 80, 255] } });
  props.coinPile(k, S, { center: [2.6, 0, 1.4], radius: 1.2, height: 0.65, count: 85, r: 0.22, rng, gem: { size: 0.4, color: [50, 225, 255] } });
  for (let i = 0; i < 14; i++) {
    const x = (rng() - 0.5) * 8, z = 1.2 + rng() * 3.2;
    if (Math.abs(x) < 1.5 && z < 2.6) continue;
    props.coin(k, S, { r: 0.19, pos: [x, 0.04, z], rot: [(rng() - 0.5) * 0.2, rng() * 3, (rng() - 0.5) * 0.2] });
  }
  for (const [x, y, z] of [[-3.6, 3.6, 0.4], [3.8, 3.3, 0.8], [-3.9, 1.9, 1.6], [4.1, 1.7, 2.0]]) {
    props.coin(k, S, { r: 0.26, pos: [x, y, z], rot: [Math.PI / 2 + (rng() - 0.5) * 0.9, (rng() - 0.5) * 0.9, (rng() - 0.5) * 0.8] });
  }
  props.sparkles(S, { count: 46, center: [0, 3.0, 0.8], box: [9, 5.5, 3], rng, min: 0.2, max: 0.7,
    colors: [[255, 120, 220], [255, 255, 255], [120, 230, 255], [255, 120, 220], [255, 230, 120]] });   // Rainbow mutation sparkle color
  R.render();
  nameTag(R, 880, [0, 4.5, 0.1], '🌈 Rainbow Void Serpent', 'rgb(255,120,220)', 'Mythic', 'rgb(0,200,255)', 42);

  await document.fonts.ready;
  requestAnimationFrame(() => requestAnimationFrame(() => { window.__thumbReady = true; }));
} catch (e) {
  window.__thumbError = String((e && e.stack) || e);
}
</script>
</body>
</html>
