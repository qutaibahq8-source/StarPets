<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Income thumbnail</title>
<link rel="stylesheet" href="lib/thumb.css">
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<!-- "Noob vs maxed" split thumbnail: 0.1 coins/s with one plain pet -> 75.4Sp/s with a golden dragon team. -->
<div id="frame">
  <canvas id="left"></canvas>
  <canvas id="right"></canvas>
  <svg class="overlay" viewBox="0 0 1920 1080"><polygon points="890,0 920,0 1000,1080 970,1080" fill="#000"/></svg>

  <div class="label" style="left:452px; top:40px; font-size:215px; --stroke:34px; --drop:14px">
    <span class="stroke">0.1/s</span><span class="fill">0.1/s</span>
  </div>
  <div class="label rainbow" style="left:1440px; top:30px; font-size:196px; --stroke:34px; --drop:14px">
    <span class="stroke">75.4Sp/s</span><span class="fill">75.4Sp/s</span>
  </div>
  <div class="label" style="left:1430px; top:250px; font-size:45px; --stroke:14px; --drop:6px">
    <span class="stroke">75,412,734,323,000,000,000,000,000/s</span><span class="fill">75,412,734,323,000,000,000,000,000/s</span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { makeStage } from './lib/stage.js';
import { mulberry32 } from './lib/kit.js';
import * as pets from './lib/pets.js';
import * as props from './lib/props.js';

try {
  // ---------------- LEFT: one plain Common pet, one dull coin
  const leftCanvas = document.getElementById('left');
  const L = makeStage(leftCanvas, {
    width: 1000, height: 1080, fov: 30,
    camPos: [1.3, 2.15, 7.0], target: [0.05, 1.28, 0],
    shadowSize: 5,
    bloom: { strength: 1.0, radius: 0.5 },
  });
  leftCanvas.style.left = '0px';
  leftCanvas.style.clipPath = 'polygon(0 0, 905px 0, 985px 1080px, 0 1080px)';
  const cat = pets.kitten(L.kit);
  cat.rotation.y = 0.42;
  L.scene.add(cat);
  props.coin(L.kit, L.scene, { r: 0.3, pos: [-1.0, 0.85, 0.55], rot: [Math.PI / 2 - 0.12, 0.0, 0.28], style: 'dull' });
  L.render();

  // ---------------- RIGHT: golden dragon team, coin piles, gems, glow
  const rightCanvas = document.getElementById('right');
  const R = makeStage(rightCanvas, {
    width: 1040, height: 1080, fov: 30,
    camPos: [0.3, 3.1, 12.2], target: [0.15, 2.35, 0],
    shadowSize: 8,
    bloom: { strength: 0.85, radius: 0.45 },
  });
  rightCanvas.style.left = '880px';
  rightCanvas.style.clipPath = 'polygon(25px 0, 1040px 0, 1040px 1080px, 105px 1080px)';
  const rng = mulberry32(7);
  const k = R.kit, S = R.scene;

  props.rays(S, { pos: [0, 2.6, -4], size: 15, color: [255, 205, 90], intensity: 0.2 });
  props.halo(S, { pos: [0, 2.4, -3.6], size: 8, color: [255, 205, 90], intensity: 0.28 });
  props.groundRing(k, S, { pos: [0, 0, 0], R: 1.9, color: [255, 205, 60] });

  const dragon = pets.dragon(k);
  dragon.scale.setScalar(1.18);
  dragon.rotation.y = -0.18;
  S.add(dragon);

  const uni = pets.unicorn(k);
  uni.position.set(-2.4, 0, -2.4);
  uni.rotation.y = 0.42;
  S.add(uni);

  const snake = pets.serpent(k);
  snake.position.set(2.95, 0, -1.7);
  snake.rotation.y = -0.5;
  S.add(snake);

  props.coinPile(k, S, { center: [-2.15, 0, 1.55], radius: 0.95, height: 0.52, count: 60, r: 0.2, rng, gem: { size: 0.32, color: [190, 80, 255] } });
  props.coinPile(k, S, { center: [2.35, 0, 1.35], radius: 1.15, height: 0.62, count: 80, r: 0.21, rng, gem: { size: 0.38, color: [50, 225, 255] } });
  for (let i = 0; i < 16; i++) {
    const x = (rng() - 0.5) * 7.5, z = 0.9 + rng() * 3.0;
    if (Math.abs(x) < 1.2 && z < 2) continue;
    props.coin(k, S, { r: 0.18, pos: [x, 0.04, z], rot: [(rng() - 0.5) * 0.2, rng() * 3, (rng() - 0.5) * 0.2] });
  }
  for (const [x, y, z] of [[-3.3, 3.1, 0.2], [3.5, 3.0, 0.6], [-3.6, 1.9, 1.2], [3.9, 1.7, 1.6], [-1.3, 0.9, 2.6]]) {
    props.coin(k, S, { r: 0.24, pos: [x, y, z], rot: [Math.PI / 2 + (rng() - 0.5) * 0.9, (rng() - 0.5) * 0.9, (rng() - 0.5) * 0.8] });
  }
  props.sparkles(S, { count: 44, center: [0, 2.4, 0.6], box: [8, 4.6, 3], rng, min: 0.18, max: 0.6,
    colors: [[255, 255, 255], [255, 220, 90], [120, 230, 255], [255, 255, 255], [255, 150, 240]] });
  R.render();

  await document.fonts.load('200px "Lilita One"');
  await document.fonts.ready;
  requestAnimationFrame(() => requestAnimationFrame(() => { window.__thumbReady = true; }));
} catch (e) {
  window.__thumbError = String((e && e.stack) || e);
}
</script>
</body>
</html>
